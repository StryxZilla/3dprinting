name: Build Cable Hider V6 STL

on:
  push:
    paths:
      - 'Cable Hider 105 Degree/generate_v6.py'
      - '.github/workflows/build-cable-hider-v6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generate revised printable STL
        run: python "Cable Hider 105 Degree/generate_v6.py"
      - name: Commit STL
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Cable Hider 105 Degree/bend_105_extended_arm_v6.stl"
          if git diff --cached --quiet; then
            echo "STL already generated"
          else
            git commit -m "Add 105-degree cable hider V6 (2mm shorter arm)"
            git push
          fi
