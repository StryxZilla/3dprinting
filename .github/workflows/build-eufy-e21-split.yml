name: Build Eufy E21 Slanted Split STL

on:
  push:
    paths:
      - 'Eufy E21 Slanted Split/mesh/**'
      - 'Eufy E21 Slanted Split/rebuild.py'
      - '.github/workflows/build-eufy-e21-split.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-stls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Reconstruct and verify print-ready models
        run: python "Eufy E21 Slanted Split/rebuild.py"
      - name: Commit generated STL files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Eufy E21 Slanted Split/"*.stl
          if git diff --cached --quiet; then
            echo "STL files already up-to-date"
          else
            git commit -m "Generate verified E21 split-mount STL files"
            git push
          fi
